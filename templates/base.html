<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>{% block title %}{{site_name}} — Discover{% endblock %}</title><meta name="description" content="{% block description %}Explore creator channels and videos on XXX World.{% endblock %}">{% block robots %}<meta name="robots" content="index,follow,max-image-preview:large">{% endblock %}<link rel="canonical" href="{{canonical(request.path)}}"><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><link rel="stylesheet" href="/static/style.css">{% block head %}{% endblock %}<script src="/static/app.js" defer></script></head><body><header class="header"><div class="bar"><a class="logo" href="/"><span class="logo-mark">XXX</span><span>WORLD</span></a><nav aria-label="Main navigation"><a href="/">Discover</a><a href="/channels">Channels</a></nav><form class="search" action="/search"><input type="search" name="q" minlength="2" required placeholder="Search videos…" aria-label="Search videos" value="{{term if term is defined else ''}}"><button type="submit" aria-label="Submit search">⌕</button></form><span class="age">18+ ONLY</span></div></header><main>{% block content %}{% endblock %}</main><footer class="footer"><div class="shell"><strong>XXX WORLD</strong><span>For adults 18+ · Honor creators and copyright</span><a href="/channels">Explore channels</a></div></footer></body></html>
