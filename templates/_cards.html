<div class="video-grid">{% for v in videos %}<article class="video-card"><a class="thumb" href="{{video_path(v.id)}}" aria-label="{{v.title}}"><img src="{{image_url(v.img)}}" alt="{{v.title}}" loading="lazy" decoding="async" referrerpolicy="no-referrer" width="360" height="202" data-preview="{{preview_url(v.img)}}"><span class="duration">{{v.duration or ''}}</span></a><div class="card-copy"><a class="video-title" href="{{video_path(v.id)}}">{{v.title}}</a><a class="creator" href="{{channel_path(v.channel_name)}}">{{v.channel_name or 'Unlisted channel'}}</a><div class="facts"><span>{{format_views(v.views)}} views</span><span>★ {{v.rating or '—'}}</span></div></div></article>{% endfor %}</div>{% if not videos %}<p class="empty">No videos found.</p>{% endif %}
