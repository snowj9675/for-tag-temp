name: Initialize secondary Neon metadata schema
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL_2: ${{ secrets.DATABASE_URL_2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]>=3.2,<4'
      - run: python setup_secondary_db.py
