name: Normalize catalog video URLs (Neon)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only inspect without updating? (true for preview)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: normalize-catalog-urls
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Validate connection secret
        run: test -n "$DATABASE_URL"
      - name: Run normalization and verify
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python migrate_video_urls.py --dry-run
          else
            python migrate_video_urls.py
          fi
