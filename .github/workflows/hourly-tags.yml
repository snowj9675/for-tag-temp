name: Continuous hourly keyword backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: keyword-backfill-single-run
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Process and checkpoint up to 55 minutes
        run: python hourly_tags.py --seconds 3300 --workers 5 --batch 100
      - name: Continue in next workflow run
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,requests
          s=json.load(open('progress.json'))
          # The checked-out file is stale; fetch the live checkpoint.
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          h={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json"}
          r=requests.get(f"https://api.github.com/repos/{repo}/contents/progress.json",headers=h,timeout=20)
          r.raise_for_status()
          import base64
          state=json.loads(base64.b64decode(r.json()["content"]))
          if state.get("complete"):
              print("Full ID sweep completed; stopping auto-dispatch.")
          else:
              r=requests.post(f"https://api.github.com/repos/{repo}/actions/workflows/hourly-tags.yml/dispatches",
                  headers=h,json={"ref":"main"},timeout=20)
              r.raise_for_status()
              print("Dispatched follow-up run.")
          PY
